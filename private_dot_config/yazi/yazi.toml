#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
sort_dir_first = true
linemode = "size"
show_hidden = true # dotfiles are the point; `.' still toggles per-session

# Open text files in Emacs (client frame in the terminal; -a "" starts
# a daemon if none is running). Overrides the default ${EDITOR:-vi} opener.
[opener]
edit = [
	{ run = 'emacsclient -t -a "" "$@"', block = true, for = "unix" },
]

# git.yazi — show git status in the file list
[[plugin.prepend_fetchers]]
id    = "git"
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
id    = "git"
url   = "*/"
run   = "git"
group = "git"

# sops.yazi — mark sops/age/gpg encrypted files (local plugin, see plugins/sops.yazi)
[[plugin.prepend_fetchers]]
id    = "sops"
url   = "*"
run   = "sops"
group = "sops"
