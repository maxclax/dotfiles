# Ranger's file opener (rifle)
# This file is used to determine which program to use to open which file.

# Define the editor for text files. `-t' opens a terminal frame in the pane
# ranger runs in; `-c' popped a GUI frame in Emacs.app and blocked ranger
# until that frame was done. Same choice as yazi's opener.
mime ^text/, label editor, has emacsclient = emacsclient -t -a "" "$@"
mime ^text/, label editor = emacs "$@"

# For when no mime type is detected but it's likely a text file
ext org|txt|md|py|js|html|css|sh|conf|rc = emacsclient -t -a "" "$@"

# Fallback for any file
else = emacsclient -t -a "" "$@"